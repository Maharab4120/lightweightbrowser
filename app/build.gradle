plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.lightweightbrowser'
    compileSdk 36

    defaultConfig {
        // Unique, non-example id suitable for Play submission. The Kotlin
        // package stays com.lightweightbrowser; namespace owns generated R.
        applicationId "io.github.maharab4120.lightweightbrowser"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Direct APK installs get one small APK per ABI; Play receives an AAB.
    // AGP cannot build split APKs and a bundle in the same invocation.
    def buildingBundle = gradle.startParameter.taskNames.any {
        it.toLowerCase().contains('bundle')
    }
    splits {
        abi {
            enable !buildingBundle
            reset()
            include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            universalApk true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    // androidx.webkit supplies true document-start injection and a scoped JS
    // message bridge. It is not a UI library; no Material/AppCompat is added.
    implementation 'androidx.webkit:webkit:1.11.0'

    // Test dependencies are build-time only and never enter the APK.
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
