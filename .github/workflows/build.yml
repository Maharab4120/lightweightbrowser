name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-36
            build-tools;36.0.0
            ndk;25.2.9519653

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Rebuild JNI libraries
        run: |
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          ./tools/build_rust.sh

      - name: Build and test APKs
        run: ./gradlew assembleDebug assembleRelease testDebugUnitTest --no-daemon --console=plain

      - name: Build App Bundle
        run: ./gradlew bundleRelease --no-daemon --console=plain

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lightweight-browser
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/release/*.aab
